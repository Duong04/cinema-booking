version: "3.8"

services:
  backend:
    build: ./backend
    container_name: cinema_booking_be_app
    volumes:
      - ./backend:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    working_dir: /var/www
    expose:
      - "9000"
    depends_on:
      - mysql
      - redis

  reverb:
    build: ./backend
    container_name: cinema_booking_reverb
    volumes:
      - ./backend:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    container_name: cinema_booking_fe_app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: cinema
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
